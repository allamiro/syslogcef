name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-python:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
          pytest

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Sign distributions
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for artifact in dist/*.tar.gz dist/*.whl; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$artifact"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    container: fedora:41
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools rpm-sign gnupg2 git \
            dnf5-plugins \
            python3-devel python3-build python3-pip \
            python3-setuptools python3-wheel \
            pyproject-rpm-macros systemd-rpm-macros

      - uses: actions/checkout@v4

      - name: Build sdist
        run: python3 -m build --sdist

      - name: Build RPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/rpm/syslogcef.spec
          rpmdev-setuptree
          cp dist/syslog2cef-*.tar.gz "$HOME/rpmbuild/SOURCES/"
          cp packaging/rpm/syslogcef.service packaging/rpm/syslogcef@.service packaging/rpm/syslogcef.conf packaging/rpm/syslogcef-instance.conf packaging/rpm/syslogcef.logrotate packaging/rpm/syslogcef.sysusers packaging/rpm/syslogcef.1 "$HOME/rpmbuild/SOURCES/"
          # Resolve the dynamically generated build requirements
          # (%pyproject_buildrequires), then do the real build. When every
          # requirement is already installed, rpmbuild -br succeeds without
          # emitting a buildreqs package, so only run builddep if one exists.
          rpmbuild -br packaging/rpm/syslogcef.spec || true
          if ls "$HOME"/rpmbuild/SRPMS/syslogcef-*.buildreqs.nosrc.rpm >/dev/null 2>&1; then
            dnf builddep -y "$HOME"/rpmbuild/SRPMS/syslogcef-*.buildreqs.nosrc.rpm
          fi
          rpmbuild -ba packaging/rpm/syslogcef.spec
          mkdir -p rpms
          cp "$HOME"/rpmbuild/RPMS/noarch/syslogcef-*.rpm rpms/
          cp "$HOME"/rpmbuild/SRPMS/syslogcef-*.src.rpm rpms/

      - name: Sign RPM
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_NAME="$(gpg --list-keys --with-colons | awk -F: '/^uid/ {print $10; exit}')"
          cat >> "$HOME/.rpmmacros" <<EOF
          %_signature gpg
          %_gpg_name ${GPG_NAME}
          %__gpg_sign_cmd %{__gpg} gpg --batch --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" --no-armor --digest-algo sha256 -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          rpmsign --addsign rpms/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-dist
          path: rpms/*

  build-standalone:
    name: Build zipapp, Debian package, and source zip
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone zipapp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pip install . --target build/zipapp --no-compile
          rm -rf build/zipapp/bin build/zipapp/*.dist-info
          mkdir -p out
          python -m zipapp build/zipapp \
            -m "syslogcef.cli:main" \
            -p "/usr/bin/env python3" \
            -c -o "out/syslogcef-${VERSION}.pyz"
          echo "conversion smoke test:" \
            && echo '<166>Jan  1 12:34:56 fw1 %ASA-6-302013: Built inbound src=1.2.3.4' \
              | "out/syslogcef-${VERSION}.pyz"

      - name: Build Debian package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/debian/build-deb.sh "$VERSION" "out/syslogcef-${VERSION}.pyz" out
          dpkg-deb --info "out/syslogcef_${VERSION}-1_all.deb"

      - name: Build source zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="syslogcef-${VERSION}/" \
            -o "out/syslogcef-${VERSION}-source.zip" HEAD

      - name: Sign artifacts
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for artifact in out/*.pyz out/*.deb out/*.zip; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$artifact"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-dist
          path: out/*

  build-apk:
    name: Build Alpine APK
    runs-on: ubuntu-latest
    container: alpine:3.21
    env:
      ABUILD_PRIVATE_KEY: ${{ secrets.ABUILD_PRIVATE_KEY }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Install build tools
        run: apk add --no-cache abuild build-base python3 py3-pip gnupg git

      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # abuild refuses to run as root
          adduser -D builder
          addgroup builder abuild

          # Signing key: use the repository secret, or an ephemeral key when absent
          mkdir -p /home/builder/.abuild
          if [ -n "$ABUILD_PRIVATE_KEY" ]; then
            printf '%s\n' "$ABUILD_PRIVATE_KEY" > /home/builder/.abuild/syslogcef.rsa
            cp packaging/apk/syslogcef.rsa.pub /home/builder/.abuild/syslogcef.rsa.pub
          else
            su builder -c "abuild-keygen -an" \
              && mv /home/builder/.abuild/*.rsa /home/builder/.abuild/syslogcef.rsa \
              && mv /home/builder/.abuild/*.rsa.pub /home/builder/.abuild/syslogcef.rsa.pub
          fi
          echo 'PACKAGER_PRIVKEY="/home/builder/.abuild/syslogcef.rsa"' > /home/builder/.abuild/abuild.conf
          cp /home/builder/.abuild/syslogcef.rsa.pub /etc/apk/keys/

          # Build the zipapp that the APK ships
          pip install . --target build/zipapp --no-compile --break-system-packages
          rm -rf build/zipapp/bin build/zipapp/*.dist-info
          python3 -m zipapp build/zipapp \
            -m "syslogcef.cli:main" \
            -p "/usr/bin/env python3" \
            -c -o "packaging/apk/syslogcef-${VERSION}.pyz"

          cp packaging/rpm/syslogcef.1 packaging/apk/
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/apk/APKBUILD
          chown -R builder packaging/apk /home/builder/.abuild
          su builder -c "cd packaging/apk && abuild checksum && abuild -r"

          mkdir -p out
          cp /home/builder/packages/packaging/*/syslogcef-*.apk out/

      - name: Sign APK with GPG (detached)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for artifact in out/*.apk; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$artifact"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apk-dist
          path: out/*

  build-docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/syslogcef
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub release
    needs: [build-python, build-rpm, build-standalone, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate and sign checksums
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd artifacts
          sha256sum *.tar.gz *.whl *.rpm *.deb *.pyz *.zip *.apk > SHA256SUMS
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor SHA256SUMS
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*

  publish-pypi:
    name: Publish to PyPI
    needs: [build-python]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Remove non-distribution files
        run: rm -f dist/*.asc

      - name: Publish (API token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish (trusted publishing)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

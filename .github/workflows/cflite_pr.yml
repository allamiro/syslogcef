name: ClusterFuzzLite

on:
  pull_request:
    paths:
      - 'syslogcef/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'

permissions: read-all

jobs:
  fuzz-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: python
          # Token needed here too: the build step fetches the latest
          # coverage-report artifact to skip unaffected fuzz targets;
          # without it that lookup 401s (harmless but noisy).
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers on the code change
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 180
          mode: 'code-change'
          sanitizer: address

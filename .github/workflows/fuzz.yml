name: Deep fuzz

on:
  schedule:
    - cron: '17 3 * * 1'  # weekly, Monday 03:17 UTC
  workflow_dispatch:

jobs:
  hypothesis-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with fuzz extra
        run: |
          python -m pip install --upgrade pip
          pip install .[test,fuzz]
      - name: Run property tests with the deep profile
        id: fuzz
        env:
          SYSLOGCEF_HYPOTHESIS_PROFILE: deep
        run: pytest tests/test_fuzz_properties.py -v
      - name: Upload failure reproduction database
        # Only when the fuzz step itself failed (not e.g. pip install),
        # so the .hypothesis directory is guaranteed to exist.
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-examples
          path: .hypothesis/examples/
          # .hypothesis is a dotfile tree; v4 skips hidden files unless told not to
          include-hidden-files: true
          if-no-files-found: warn

# Path-based PR labels, applied by .github/workflows/triage.yml
docker:
  - changed-files:
      - any-glob-to-any-file:
          - Dockerfile
          - .dockerignore

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - 'packaging/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

python:
  - changed-files:
      - any-glob-to-any-file:
          - 'syslogcef/**'
          - 'pyproject.toml'

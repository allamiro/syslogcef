[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syslog2cef"
version = "0.3.3"
description = "Convert RFC3164/RFC5424 syslog lines into ArcSight CEF"
authors = [{name = "Tamir Suliman", email = "allamiro@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Logging",
]
keywords = ["syslog", "cef", "logging", "security"]
dependencies = []

[project.urls]
Homepage = "https://github.com/allamiro/syslogcef"
Issues = "https://github.com/allamiro/syslogcef/issues"

[project.optional-dependencies]
test = [
  "pytest>=7",
]
kafka = [
  "kafka-python>=2.0",
]
fuzz = [
  "hypothesis>=6",
]

[project.scripts]
syslogcef = "syslogcef.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["syslogcef", "syslogcef.mappings"]

[tool.setuptools.package-data]
syslogcef = ["mappings/*.json", "dictionary.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Start conservative: syntax errors and pyflakes (undefined names,
# unused imports). Widen the selection as the codebase is cleaned up.
select = ["E9", "F"]

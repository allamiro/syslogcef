<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="syslog2cef demo: converting syslog to CEF in different ways" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="2" y="2" width="876" height="296" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
  <rect x="2" y="2" width="876" height="38" rx="16" fill="#1e293b"/>
  <rect x="2" y="22" width="876" height="18" fill="#1e293b"/>
  <circle cx="28" cy="21" r="6.5" fill="#f87171"/>
  <circle cx="50" cy="21" r="6.5" fill="#fbbf24"/>
  <circle cx="72" cy="21" r="6.5" fill="#34d399"/>
  <text x="440" y="26" font-size="14" fill="#94a3b8" text-anchor="middle">syslog2cef — demo</text>

  <!-- ============ scene 1: pipe a Cisco ASA line ============ -->
  <g opacity="0">
    <animate attributeName="opacity" dur="21s" repeatCount="indefinite"
      keyTimes="0;0.01;0.30;0.325;1" values="0;1;1;0;0"/>
    <text x="30" y="80" font-size="14"><tspan fill="#34d399">$</tspan><tspan fill="#e2e8f0" dx="8">echo '&lt;166&gt;Jan  1 12:34:56 fw1 %ASA-6-302013: Built inbound src=10.0.0.1 dst=10.0.0.2' | syslogcef</tspan></text>
    <g opacity="0">
      <animate attributeName="opacity" dur="21s" repeatCount="indefinite"
        keyTimes="0;0.05;0.30;0.325;1" values="0;1;1;0;0"/>
      <text x="30" y="118" font-size="14"><tspan fill="url(#accent)" font-weight="bold">CEF:0</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">Cisco</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">ASA</tspan><tspan fill="#475569">|</tspan><tspan fill="#94a3b8">auto</tspan><tspan fill="#475569">|</tspan><tspan fill="#34d399">asa.ASA-6-302013</tspan><tspan fill="#475569">|</tspan><tspan fill="#94a3b8">Built inbound...</tspan><tspan fill="#475569">|</tspan><tspan fill="#f87171">2</tspan><tspan fill="#475569">|</tspan></text>
      <text x="60" y="140" font-size="14" fill="#e2e8f0">src=10.0.0.1 dst=10.0.0.2 event_code=ASA-6-302013 msg=Built inbound...</text>
      <text x="30" y="180" font-size="13" fill="#64748b"># auto-detected: RFC3164 + Cisco mapping, severity 6 -&gt; CEF 2, headers escaped</text>
    </g>
  </g>

  <!-- ============ scene 2: Fortinet key=value file ============ -->
  <g opacity="0">
    <animate attributeName="opacity" dur="21s" repeatCount="indefinite"
      keyTimes="0;0.33;0.34;0.63;0.655;1" values="0;0;1;1;0;0"/>
    <text x="30" y="80" font-size="14"><tspan fill="#34d399">$</tspan><tspan fill="#e2e8f0" dx="8">syslogcef fortigate.log --output events.cef &amp;&amp; head -1 events.cef</tspan></text>
    <g opacity="0">
      <animate attributeName="opacity" dur="21s" repeatCount="indefinite"
        keyTimes="0;0.33;0.38;0.63;0.655;1" values="0;0;1;1;0;0"/>
      <text x="30" y="118" font-size="14"><tspan fill="url(#accent)" font-weight="bold">CEF:0</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">Fortinet</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">FortiGate</tspan><tspan fill="#475569">|</tspan><tspan fill="#94a3b8">auto</tspan><tspan fill="#475569">|</tspan><tspan fill="#34d399">fortinet.0102043014</tspan><tspan fill="#475569">|</tspan><tspan fill="#94a3b8">...</tspan><tspan fill="#475569">|</tspan><tspan fill="#f87171">3</tspan><tspan fill="#475569">|</tspan></text>
      <text x="60" y="140" font-size="14" fill="#e2e8f0">dvchost=testswitch3 src=10.1.1.1 dst=10.2.2.2 act=login cat=event</text>
      <text x="30" y="180" font-size="13" fill="#64748b"># key=value streams (Fortinet, Sophos) parse without any configuration</text>
    </g>
  </g>

  <!-- ============ scene 3: tail multiple files as a pipeline ============ -->
  <g opacity="0">
    <animate attributeName="opacity" dur="21s" repeatCount="indefinite"
      keyTimes="0;0.66;0.67;0.985;1" values="0;0;1;1;0"/>
    <text x="30" y="80" font-size="14"><tspan fill="#34d399">$</tspan><tspan fill="#e2e8f0" dx="8">syslogcef /var/log/asa.log /var/log/messages --tail --append -o events.cef</tspan></text>
    <g opacity="0">
      <animate attributeName="opacity" dur="21s" repeatCount="indefinite"
        keyTimes="0;0.66;0.71;0.985;1" values="0;0;1;1;0"/>
      <text x="30" y="118" font-size="14"><tspan fill="url(#accent)" font-weight="bold">CEF:0</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">Cisco</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">ASA</tspan><tspan fill="#475569">|</tspan><tspan fill="#94a3b8">auto</tspan><tspan fill="#475569">|</tspan><tspan fill="#34d399">asa.ASA-6-305011</tspan><tspan fill="#475569">|...|</tspan><tspan fill="#f87171">2</tspan><tspan fill="#475569">|</tspan><tspan fill="#e2e8f0">src=172.31.98.44</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="21s" repeatCount="indefinite"
        keyTimes="0;0.66;0.76;0.985;1" values="0;0;1;1;0"/>
      <text x="30" y="140" font-size="14"><tspan fill="url(#accent)" font-weight="bold">CEF:0</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">Linux</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">Syslog</tspan><tspan fill="#475569">|</tspan><tspan fill="#94a3b8">auto</tspan><tspan fill="#475569">|</tspan><tspan fill="#34d399">linux.syslog</tspan><tspan fill="#475569">|...|</tspan><tspan fill="#f87171">2</tspan><tspan fill="#475569">|</tspan><tspan fill="#e2e8f0">msg=Accepted publickey for root</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="21s" repeatCount="indefinite"
        keyTimes="0;0.66;0.81;0.985;1" values="0;0;1;1;0"/>
      <text x="30" y="162" font-size="14"><tspan fill="url(#accent)" font-weight="bold">CEF:0</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">Cisco</tspan><tspan fill="#475569">|</tspan><tspan fill="#fbbf24">IOS</tspan><tspan fill="#475569">|</tspan><tspan fill="#94a3b8">auto</tspan><tspan fill="#475569">|</tspan><tspan fill="#34d399">ios.SEC-6-IPACCESSLOGRP</tspan><tspan fill="#475569">|...|</tspan><tspan fill="#f87171">2</tspan><tspan fill="#475569">|</tspan><tspan fill="#e2e8f0">src=198.51.100.197</tspan></text>
      <text x="30" y="200" font-size="13" fill="#64748b"># both files tailed concurrently; same pipeline runs as a systemd/OpenRC service</text>
    </g>
  </g>

  <!-- prompt + blinking cursor, always visible at the bottom -->
  <text x="30" y="256" font-size="14" fill="#34d399">$</text>
  <rect x="48" y="243" width="10" height="17" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
</svg>

# OSS-Fuzz project config for syslog2cef. To enroll, copy this directory's
# three files to projects/syslog2cef/ in a fork of google/oss-fuzz and open
# a PR — see fuzz/README.md for the process and eligibility notes.
homepage: https://github.com/allamiro/syslog2cef
language: python
primary_contact: allamiro@gmail.com
main_repo: https://github.com/allamiro/syslog2cef.git
fuzzing_engines:
  - libfuzzer
# Python/Atheris projects support AddressSanitizer only; UBSan builds
# would fail OSS-Fuzz validation.
sanitizers:
  - address

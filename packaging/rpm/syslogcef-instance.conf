# Sample per-instance configuration for the syslogcef template service.
#
# Each pipeline is one file in /etc/syslogcef/conf.d/. Copy this sample:
#   cp example.conf.sample secure.conf
#   systemctl enable --now syslogcef@secure
# The instance name after "@" selects the conf.d file, and each instance
# is an independent service with its own restart policy and journal.
#
# The service runs:
#   syslogcef $INPUT_FILE --tail --append --output $OUTPUT_FILE $EXTRA_ARGS

# File to follow for new syslog lines. Multiple files may be given,
# separated by spaces.
INPUT_FILE=/var/log/secure

# File that converted CEF events are appended to. strftime codes start a
# new file when the rendered path changes; parent directories are created.
# Example of hourly files under a daily directory:
#   OUTPUT_FILE=/var/log/syslogcef/%Y-%m-%d/secure-%H.cef
OUTPUT_FILE=/var/log/syslogcef/secure.cef

# Extra arguments, for example: --mode rfc3164 --mapping /etc/syslogcef/mapping.json
#
# Network daemon mode: leave INPUT_FILE empty and use --listen/--send here.
# --listen overrides file input; OUTPUT_FILE then serves as a local archive.
# The unit carries CAP_NET_BIND_SERVICE, so ports below 1024 work.
# Example:
#   INPUT_FILE=
#   EXTRA_ARGS=--listen udp:514 --send tcp://siem.example.com:514
EXTRA_ARGS=

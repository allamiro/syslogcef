# Configuration for the syslogcef systemd service.
# The service runs:
#   syslogcef $INPUT_FILE --tail --append --output $OUTPUT_FILE $EXTRA_ARGS

# File to follow for new syslog lines. Multiple files may be given,
# separated by spaces.
INPUT_FILE=/var/log/messages

# File that converted CEF events are appended to.
OUTPUT_FILE=/var/log/syslogcef/events.cef

# Extra arguments, for example: --mode rfc3164 --mapping /etc/syslogcef/mapping.json
#
# Network daemon mode: leave INPUT_FILE empty and use --listen/--send here.
# --listen overrides file input; OUTPUT_FILE then serves as a local archive.
# The unit carries CAP_NET_BIND_SERVICE, so ports below 1024 work.
# Example:
#   INPUT_FILE=
#   EXTRA_ARGS=--listen udp:514 --send tcp://siem.example.com:514
EXTRA_ARGS=
